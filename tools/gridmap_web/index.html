<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevation map</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; color: #e5edf5; background: #10161f; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1400px; margin: auto; padding: clamp(14px, 3vw, 42px); }
  header, .controls, .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  header { justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 1.55rem; margin: 0; }
  button, select { font: inherit; padding: 7px 11px; border: 1px solid #45576b; border-radius: 6px; background: #1b2636; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  #color-lock[aria-pressed="true"] { border-color: #89f5ff; background: #233e50; }
  .color-scale { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  #gradient { width: 92px; height: 9px; border-radius: 3px; background: linear-gradient(90deg, #215c9e, #45d1a6, #f5ab4f); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .metrics div { border: 1px solid #344356; border-radius: 8px; padding: 10px 14px; background: #17212e; }
  dt, .legend, #details { color: #b4c6d8; font-size: .9rem; }
  dd { margin: 3px 0 0; font-variant-numeric: tabular-nums; }
  .viewport { position: relative; height: min(65vh, 720px); min-height: 300px; border: 1px solid #344356; border-radius: 8px; overflow: hidden; }
  #scene, #scan-overlay { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #scene { touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #scan-overlay { z-index: 1; pointer-events: none; }
  .legend { margin-top: 12px; }
  .key::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--key); }
  #status { min-height: 1.5em; margin: 10px 0 0; color: #ffcc83; overflow-wrap: anywhere; }
  #details { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Elevation map</h1>
    <div class="controls">
      <label>Layer <select id="layer" disabled></select></label>
      <button id="top" type="button">Top view</button>
      <button id="focus-scan" type="button" disabled>Focus scan</button>
      <button id="orbit" type="button">Reset 3D</button>
    </div>
  </header>
  <dl class="metrics">
    <div><dt>Orin receive rate</dt><dd id="orin">—</dd></div>
    <div><dt>Browser frame rate</dt><dd id="browser">—</dd></div>
    <div><dt>Map age at Orin</dt><dd id="age">—</dd></div>
    <div><dt>HTTP fetch time</dt><dd id="fetch">—</dd></div>
  </dl>
  <div class="viewport">
    <canvas id="scene" aria-label="Interactive elevation terrain. Drag to rotate and scroll to zoom."></canvas>
    <canvas id="scan-overlay" aria-hidden="true"></canvas>
  </div>
  <div class="legend">
    <span class="key" style="--key:#ffe066">Valid scan</span>
    <span class="key" style="--key:#ff5570">Missing height at reference plane</span>
    <span class="key" style="--key:#89f5ff">Robot origin and forward arrow</span>
    <div class="color-scale">
      <button id="color-lock" type="button" aria-pressed="false" disabled>Lock color scale</button>
      <span id="gradient" aria-hidden="true" hidden></span>
      <span id="range">Waiting for heights</span>
    </div>
  </div>
  <p id="details"></p>
  <p id="status" role="status">Waiting for GridMap…</p>
</main>
<script type="module" src="/viewer.js"></script>
</body>
</html>
